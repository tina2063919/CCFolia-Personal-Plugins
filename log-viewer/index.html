<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCFolia Log 檢視器</title>
<script>
  // 提前套用主題，避免閃爍
  (() => {
    let t = null;
    try { t = localStorage.getItem('lv-theme'); } catch {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <button class="btn icon" id="menuBtn" title="檔案列表" aria-label="檔案列表">☰</button>
  <h1>CCFolia Log 檢視器</h1>
  <span class="spacer"></span>
  <button class="btn primary" id="uploadBtn">上傳<span class="hide-sm">&nbsp;HTML</span></button>
  <button class="btn icon" id="themeBtn" title="切換明暗主題" aria-label="切換明暗主題"></button>
  <input type="file" id="fileInput" accept=".html,.htm,text/html" multiple hidden>
</header>

<div class="layout">
  <aside>
    <div class="aside-top">
      <input class="field" id="search" type="search" placeholder="搜尋檔案…">
    </div>
    <ul id="fileList"></ul>
    <div class="aside-foot" id="storageInfo">檔案儲存於此瀏覽器</div>
  </aside>

  <main id="main">
    <div class="empty" id="empty">
      <div class="drop-card">
        <strong id="emptyTitle">尚未開啟檔案</strong>
        <span id="emptyText">拖曳 CCFolia 或 Discord 機器人匯出的 HTML 到此處，或從左側選擇已上傳的檔案。</span>
        <br><button class="btn primary" id="uploadBtn2">選擇檔案</button>
      </div>
    </div>

    <div id="viewer" hidden>
      <div class="toolbar">
        <select class="field" id="channel" hidden></select>
        <span class="spacer"></span>
        <span class="dirty-dot" id="dirty" hidden>● 尚未儲存</span>
        <button class="btn" id="editBtn">編輯</button>
        <button class="btn" id="sourceBtn">原始碼</button>
        <button class="btn primary" id="saveBtn" disabled>儲存</button>
        <button class="btn" id="shareBtn">分享</button>
        <button class="btn" id="shareUpdateBtn" hidden>更新分享內容</button>
        <button class="btn" id="downloadBtn">下載</button>
        <button class="btn danger" id="deleteBtn">刪除</button>
      </div>
      <div class="log" id="log">
        <input id="title" readonly spellcheck="false" aria-label="標題">
        <div class="log-info" id="info"></div>
        <div id="messages"></div>
      </div>
    </div>
  </main>
</div>

<dialog id="sourceDlg">
  <form method="dialog">
    <div class="d-head">編輯原始碼</div>
    <textarea id="sourceText" spellcheck="false"></textarea>
    <div class="d-foot">
      <button class="btn" value="cancel">取消</button>
      <button class="btn primary" value="apply">套用</button>
    </div>
  </form>
</dialog>

<dialog id="shareDlg" class="small">
  <div class="d-head">分享紀錄<span class="spacer"></span><button class="btn icon" id="shareClose" aria-label="關閉">✕</button></div>
  <div class="d-body" id="shareBody"></div>
</dialog>

<div class="toast" id="toast"></div>
<style id="avatarCss"></style>

<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/format.js"></script>
<script src="js/render.js"></script>
<script src="js/files.js"></script>
<script src="js/editor.js"></script>
<script src="js/share.js"></script>
<script src="js/main.js"></script>
</body>
</html>
